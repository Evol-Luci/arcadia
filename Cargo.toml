[workspace]
resolver = "2"
members = [
    "core/dreamvault",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Arcadia Project"]
repository = "https://github.com/Evol-Luci/arcadia"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "macros", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Decompression for launching zipped ROMs on emulators that don't read archives
# natively. Pure-Rust deflate backend only (no C codecs): we never write zips,
# only extract STORED/DEFLATE entries to a temp dir at launch.
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
